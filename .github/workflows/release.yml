name: Release

# Publish to npm on a version tag. Cut a release with:
#
#   npm version <patch|minor|major>   # bumps package.json, syncs the plugin manifest
#                                      # version, commits + tags
#   git push --follow-tags
#
# Pushing the v* tag triggers this workflow, which self-tests and publishes.
#
# One-time setup: add an npm automation token as the repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate -> "Automation"). The job also mints
# npm provenance (a signed, public attestation that this tarball was built from
# this commit in this workflow) — fitting for a tool whose whole pitch is trust.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance (--provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Belt-and-suspenders: prepublishOnly runs this too, but a named step gives a
      # clear, early red X if the suite is broken before we ever touch the registry.
      - name: Self-test gate
        run: node repo-verify/self-test.mjs

      - name: Publish to npm (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A failed publish used to look exactly like a successful release: the tag exists, the
      # GitHub Release is published, the changelog says shipped — and npm is a version behind.
      # v0.1.4 failed that way (expired NPM_TOKEN) and went unnoticed for two days, because npm
      # answers an AUTH failure with `404 Not Found - PUT .../forespec`, which reads like a
      # missing package rather than a rejected credential. Nothing downstream looked at the
      # registry, so nothing could tell the difference. This step is that check.
      #
      # It is also the project's own thesis applied to itself: a green that verified nothing is
      # the expensive kind of failure.
      - name: Verify it actually landed on the registry
        run: |
          set -uo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"

          # Catch the other way a release goes wrong: a tag that doesn't match what was packed.
          # Cheap, and it fails before anyone trusts the tag as a version marker.
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

          # npm's read path is CDN-cached and lags a publish by up to a couple of minutes — a
          # single immediate check reports a false failure on a publish that worked. Poll instead:
          # a release gate that cries wolf gets ignored, which is the failure it exists to prevent.
          for i in $(seq 1 12); do
            LATEST=$(curl -sS -m 15 -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/-/package/$NAME/dist-tags" 2>/dev/null \
              | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).latest}catch(e){''}" 2>/dev/null || echo "")
            if [ "$LATEST" = "$VERSION" ]; then
              echo "registry dist-tags.latest = $VERSION"
              # dist-tags can move independently of the tarball; confirm the version resolves too,
              # so "latest points at it" and "it is installable" are both established.
              curl -sSf -m 15 -o /dev/null -H 'Cache-Control: no-cache' \
                "https://registry.npmjs.org/$NAME/$VERSION" \
                || { echo "::error::dist-tags says $VERSION but $NAME@$VERSION does not resolve"; exit 1; }
              echo "$NAME@$VERSION is published and installable."
              exit 0
            fi
            echo "attempt $i/12: registry latest = ${LATEST:-<unreachable>}, want $VERSION — retrying in 15s"
            sleep 15
          done

          echo "::error::publish reported success but $NAME@$VERSION is not the registry's latest after 3 minutes. Check NPM_TOKEN: npm answers an auth failure with a 404."
          exit 1
