name: Release

# Publish to npm. There are two ways in, and both end at the same gates.
#
# Tag push (the normal path). Cut a release with:
#
#   npm version <patch|minor|major>   # bumps package.json, syncs the plugin manifest
#                                      # version, commits + tags
#   git push --follow-tags
#
# Manual run (workflow_dispatch), for when the tag cannot be pushed from where the
# release is being cut — a credential scoped to feature branches, for instance. Run
# this workflow against the branch holding the release commit and pass the version
# (e.g. 0.2.1). The workflow verifies it matches package.json, then creates the v* tag
# itself, so a released version still has exactly one tag marking exactly one commit.
#
# One-time setup: add an npm automation token as the repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate -> "Automation"). The job also mints
# npm provenance (a signed, public attestation that this tarball was built from
# this commit in this workflow) — fitting for a tool whose whole pitch is trust.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must equal package.json on the selected ref (e.g. 0.2.1)"
        required: true
        type: string

permissions:
  contents: write # create the v* tag on a manual run; read-only is enough for a tag push
  id-token: write # required for npm provenance (--provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # One place decides what this run is allowed to publish, so the tag-push and manual
      # paths cannot drift. The mismatch check that used to live in the final verify step
      # runs here instead: it costs nothing and failing before the registry is touched is
      # strictly better than failing after.
      - name: Resolve the version this run is publishing
        id: target
        env:
          # Via env, never interpolated into the script body — a workflow input is
          # attacker-controllable in the general case, and `run:` interpolation is how
          # that becomes shell injection.
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${REQUESTED#v}"
          else
            WANT="${GITHUB_REF_NAME#v}"
          fi
          if [ "$VERSION" != "$WANT" ]; then
            echo "::error::asked to publish $WANT but package.json at $GITHUB_SHA is $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION from $GITHUB_SHA"

      # Belt-and-suspenders: prepublishOnly runs this too, but a named step gives a
      # clear, early red X if the suite is broken before we ever touch the registry.
      - name: Self-test gate
        run: node repo-verify/self-test.mjs

      # Manual path only — the tag-push path arrived here because the tag already exists.
      # Deliberately after the self-test: a tag is a permanent claim that a commit was
      # released, so it is not made until the commit has earned it.
      #
      # This push does not re-trigger the workflow: GitHub does not fire workflow events
      # for refs pushed with the default GITHUB_TOKEN, which is what makes this safe.
      - name: Create the release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            # Re-running a failed publish is fine. Silently moving a released tag is not.
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists at $EXISTING, not $GITHUB_SHA — refusing to move a release tag"
              exit 1
            fi
            echo "$TAG already points at $GITHUB_SHA."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "created $TAG at $GITHUB_SHA"
          fi

      - name: Publish to npm (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A failed publish used to look exactly like a successful release: the tag exists, the
      # GitHub Release is published, the changelog says shipped — and npm is a version behind.
      # v0.1.4 failed that way (expired NPM_TOKEN) and went unnoticed for two days, because npm
      # answers an AUTH failure with `404 Not Found - PUT .../forespec`, which reads like a
      # missing package rather than a rejected credential. Nothing downstream looked at the
      # registry, so nothing could tell the difference. This step is that check.
      #
      # It is also the project's own thesis applied to itself: a green that verified nothing is
      # the expensive kind of failure.
      - name: Verify it actually landed on the registry
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -uo pipefail
          NAME=$(node -p "require('./package.json').name")

          # npm's read path is CDN-cached and lags a publish — a single immediate check reports a
          # false failure on a publish that worked. Poll instead: a release gate that cries wolf
          # gets ignored, which is the failure it exists to prevent.
          #
          # The window is 10 minutes because 3 was not enough. On v0.2.2 the publish step exited
          # clean at 14:43:40 and `dist-tags.latest` did not move until 14:48:50 — 310 seconds, on
          # a gate that gave up at 183. It failed the release of a package that was published and
          # installable, which is exactly the wolf-crying the comment above warns about, and it
          # cannot be undone by re-running: npm answers a second publish of an existing version
          # with a 403, so the rerun goes red at an earlier step and the run stays red forever.
          #
          # 40 attempts is deliberately more headroom than the 310s observed. The cost of waiting
          # is wall-clock on a job that is otherwise seconds; the cost of being too short is a red
          # release that shipped fine, and a gate nobody believes the next time it is right.
          for i in $(seq 1 40); do
            LATEST=$(curl -sS -m 15 -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/-/package/$NAME/dist-tags" 2>/dev/null \
              | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).latest}catch(e){''}" 2>/dev/null || echo "")
            if [ "$LATEST" = "$VERSION" ]; then
              echo "registry dist-tags.latest = $VERSION"
              # dist-tags can move independently of the tarball; confirm the version resolves too,
              # so "latest points at it" and "it is installable" are both established.
              curl -sSf -m 15 -o /dev/null -H 'Cache-Control: no-cache' \
                "https://registry.npmjs.org/$NAME/$VERSION" \
                || { echo "::error::dist-tags says $VERSION but $NAME@$VERSION does not resolve"; exit 1; }
              echo "$NAME@$VERSION is published and installable."
              exit 0
            fi
            echo "attempt $i/40: registry latest = ${LATEST:-<unreachable>}, want $VERSION — retrying in 15s"
            sleep 15
          done

          echo "::error::publish reported success but $NAME@$VERSION is not the registry's latest after 10 minutes."
          echo "::error::Check NPM_TOKEN first — npm answers an auth failure with a 404, which reads like a missing package rather than a rejected credential."
          echo "::error::Then check the registry by hand before assuming this is real: curl https://registry.npmjs.org/-/package/$NAME/dist-tags"
          exit 1
